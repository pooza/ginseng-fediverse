acct:
  pattern: ((?<=^|[^\/[:word:]])@(([a-z0-9_]+([a-z0-9_\.-]+[a-z0-9_]+)?)(?:@[a-z0-9\.\-]+[a-z0-9]+)?))
hashtag:
  # タグ名の部分。⚠ **抽出と無毒化で共有する**（`%{name}` へ埋め込む）。
  # ⚠⚠ Mastodon v4.7.2 の `HASHTAG_FIRST_SEQUENCE` / `HASHTAG_LAST_SEQUENCE` の写し。
  # 区切りは `_` と U+00B7（ラテンの中点）と U+200C（ZWNJ）だけで、
  # 🔴 **中黒 U+30FB は意図して入れていない**（理由は parser.rb の `hashtag_pattern`）。
  name: (?:[[:word:]_][[:word:]_\u00b7\u200c]*[[:alpha:]_\u00b7\u200c][[:word:]_\u00b7\u200c]*[[:word:]_]|[[:word:]_]*[[:alpha:]][[:word:]_]*)
  # 抽出用。⚠ **Mastodon の `HASHTAG_RE` と同じ境界**（行頭か空白の直後だけ）。
  pattern: (?<=^|[[:space:]])[#＃](%{name})
  # 無毒化用。🔴 **境界だけ広い** — Misskey（mfm-js）は直前が ASCII 英数でなければ
  # タグにするので、`search／#サーチ2` や `あ#タグ` もリンク化される。
  sigil_pattern: (?:^|[^\/\)\w])[#＃](%{name})
mastodon:
  followees:
    limit: 500
  followers:
    limit: 500
  status:
    default_max_length: 500
  test_toot: 1
  token: test
  url: https://mstdn.b-shock.org/
meisskey:
  attachment:
    limit: 8
  status:
    default_max_length: 1000
  token: test
  url: null
misskey:
  attachment:
    limit: 16
  status:
    default_max_length: 3000
  token: test
  url: https://misskey.delmulin.com/
mulukhiya:
  url: https://mstdn.b-shock.org/
package:
  authors:
    - Tatsuya Koishi
  description: ginseng Fediverse libraries
  email:
    - tkoishi@b-shock.co.jp
  license: MIT
  url: https://github.com/pooza/ginseng-fediverse
  version: 3.0.0
parser:
  note:
    url:
      patterns:
        - ^/notes/([[:alnum:]]+)
    visibility:
      direct:
        icon: envelope
        name: specified
      private:
        icon: lock
        name: followers
      public:
        icon: globe
        name: public
      unlisted:
        icon: house
        name: home
  toot:
    url:
      patterns:
        - ^/web/statuses/([[:digit:]]+)
        - ^/@[[:word:]]+/([[:digit:]]+)
        - ^/users/[[:word:]]+/statuses/([[:digit:]]+)
        - ^/ap/users/[[:digit:]]+/statuses/([[:digit:]]+)
        - ^/notice/([[:word:]]+)
    visibility:
      direct:
        icon: envelope
        name: direct
      private:
        icon: lock
        name: private
      public:
        icon: earth-asia
        name: public
      unlisted:
        icon: lock-open
        name: unlisted
pleroma:
  attachment:
    limit: 4
  status:
    default_max_length: 5000
  token: test
  url: null
