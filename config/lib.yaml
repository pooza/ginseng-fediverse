acct:
  pattern: ((?<=^|[^\/[:word:]])@(([a-z0-9_]+([a-z0-9_\.-]+[a-z0-9_]+)?)(?:@[a-z0-9\.\-]+[a-z0-9]+)?))
  # 無毒化用。⚠⚠ **境界だけ抽出用より広く取る**（`hashtag/sigil_pattern` と同じ考え方）。
  # 🔴🔴 抽出用は `[[:word:]]` の直後を除くので、**和文字・`_` の直後の `@` を拾わない**。
  # ⚠⚠ Misskey（mfm-js）は**直前が ASCII 英数のときだけ**メンションにしないので、
  # `ラブ@pooza` `_@admin` は**通知が飛ぶ**（実測 0.26.0）。
  # ⚠ **mfm-js の規則をそのまま写す**（`/[a-z0-9]$/i`）。🔴 広げすぎると
  # `H@ppy` `info@example.com` のような**どこもメンションにしない本文を壊す**（#273）。
  # 🔴 **`/` は除かない。**mfm-js は `曲/@admin` もメンションにする（実測 0.26.0）。
  # ⚠ `https://example.com/@pooza` は `sigil/url_pattern` で丸ごと除外するので、ここで守らなくてよい。
  # ⚠ 全角 `＃` と同じく、全角 `＠` は **Misskey がメンションにしない**ので広げない。
  # 🔴 **境界だけは `/i` を効かせない (#298)。**Ruby の `/i` は `ſ`（U+017F）を英字として扱い、
  # `ſ@admin` を素通りしていた（mfm-js は u フラグなしなので英字にしない）。
  sigil_pattern: ((?<!(?-i:[a-zA-Z0-9]))@(([a-z0-9_]+([a-z0-9_\.-]+[a-z0-9_]+)?)(?:@[a-z0-9\.\-]+[a-z0-9]+)?))
sigil:
  # 無毒化で**丸ごと除外する URL の範囲** — ⚠⚠ **mfm-js の `urlChar` の写し**（0.26.0）。
  # 🔴 無毒化の境界を広げると、**URL の途中の `_@name` `_#frag` まで区切って URL を壊す**
  # （`https://example.com/_@ admin`）。⚠ mfm-js は URL を 1 つのトークンとして食うので、
  # **中の `@` / `#` はメンションにもタグにもならない**＝守る相手がいない。
  # ⚠ 括弧は入れていない（mfm-js は対になる括弧だけ URL に含める）。🔴 入れると
  # `https://a.com)@admin` のような**メンションになる形まで除外する**ので、安全側（区切る側）に倒した。
  # 🔴🔴 **大文字小文字を区別する (#298)。**mfm-js の scheme は `https?://` だけで、
  # `HTTPS://x/@admin` を URL と読まない — 除外すると `@admin` に通知が飛んでいた。
  # ⚠ `/i` は使わず ASCII を並べる — 🔴 Ruby の `/i` は `ſ`（U+017F）を `s` に当て、
  # mfm-js が URL を切る位置より先まで除外する（`https://xſ/@admin`）。
  # ⚠ 手前のトークンが scheme を食う形（`詳細:https://` `$[https://` `#タグ・https://`）は
  # Service.escape_sigils で見る。
  url_pattern: https?://[.,a-zA-Z0-9_/:%#@$&?!~=+\-]+
hashtag:
  # タグ名の部分。⚠ **抽出と無毒化で共有する**（`%{name}` へ埋め込む）。
  # ⚠⚠ Mastodon v4.7.2 の `HASHTAG_FIRST_SEQUENCE` / `HASHTAG_LAST_SEQUENCE` の写し。
  # 区切りは `_` と U+00B7（ラテンの中点）と U+200C（ZWNJ）だけで、
  # 🔴 **中黒 U+30FB は意図して入れていない**（理由は lib/ginseng/fediverse/parser.rb の
  # `hashtag_pattern`）。
  # 🔴🔴 **写し元と違い、繰り返しに上限を置いている（リリース前レビューの赤）。**
  # ⚠⚠ 区切り（`·` / ZWNJ）は `[[:word:]]` ではないのに途中に許されるので、
  # **上限が無いと `#a` のあとに区切りが続く本文で二次爆発する**（実測: 30KB で
  # 12.7 秒 → 上限を置くと 0.64 秒で、以降は長さに比例する）。
  # ⚠ 上流は自分のユーザーが書いた上限付きの本文にしか当てないが、こちらは
  # `sanitize_status` 経由で**遠隔のフィード本文**に当たる。
  # ⚠⚠ **無毒化の安全性は落ちない** — 入れるのは印の直後の空白なので、
  # 名前をどこまで数えたかは結果に効かない。効くのは抽出（長すぎるタグ名）だけ。
  name: (?:[[:word:]_][[:word:]_\u00b7\u200c]{0,30}[[:alpha:]_\u00b7\u200c][[:word:]_\u00b7\u200c]{0,30}[[:word:]_]|[[:word:]_]*[[:alpha:]][[:word:]_]*)
  # 抽出用。⚠ **Mastodon の `HASHTAG_RE` と同じ境界**（行頭か空白の直後だけ）。
  pattern: (?<=^|[[:space:]])[#＃](%{name})
  # 無毒化用。⚠⚠ **境界は印ごとに違う — 「どちらかの投稿先がリンク化する形」の和集合**。
  # 半角 `#` は広い：Misskey（mfm-js）は**直前が ASCII 英数でなければ**タグにするので、
  # `search／#サーチ2` や `あ#タグ` もリンク化される。
  # 🔴🔴 **除くのは ASCII 英数と `/` だけ（リリース前レビューの赤）。** ⚠⚠ 初版は `\w`
  # で除いていたので **`_` が余分**で、`)` も外していた — `曲名_#タグ` `(1)#タグ` は
  # **Misskey がリンク化するのに素通り**していた（実測）。
  # ⚠⚠ **mfm-js の規則をそのまま写す**（`/[a-z0-9]$/i` ＝ ASCII 英数のときだけ失敗）。
  # 🔴 逆に広げすぎると `a#b` のような**どこもリンク化しない本文を壊す** — #273 で
  # `H@ppy Together!!!` を `H@ ppy` にしていたのと同じ失敗の形。
  # ⚠ `/` を残すのは `https://example.com/#anchor` を壊さないため（そこは mfm 側も
  # URL として食うので、守る相手がいない）。
  # 🔴 **消費ではなく後読みにする。** ⚠⚠ 直前の 1 文字を食う形だと、**隣り合う 2 つ目の
  # タグ（`#あ#い`）を取りこぼす** — 1 つ目の置換で `#` を消費してしまうため。
  # 🔴 全角 `＃` は Mastodon と同じ境界だけ：**Misskey は `＃` をそもそもタグにしない**ので、
  # 広げると `あ＃タグ` のような**どこもリンク化しない本文を壊す**（Codex P2 ・実測済み）。
  # ⚠ タグの走査に許す時間（秒）。🔴 **細工された本文で二次爆発する**ので上限が要る
  # （理由は lib/ginseng/fediverse/parser.rb の `create_hashtag_pattern`）。
  # ⚠ 普通の本文は 2,500 文字で 0.0015 秒なので、1 秒は十分に余裕がある。
  timeout: 1.0
  sigil_pattern: (?:(?<![a-zA-Z0-9\/])#|(?<=^|[[:space:]])＃)(%{name})
mastodon:
  followees:
    limit: 500
  followers:
    limit: 500
  status:
    default_max_length: 500
  test_toot: 1
  token: test
  url: https://mstdn.b-shock.org/
meisskey:
  attachment:
    limit: 8
  status:
    default_max_length: 1000
  token: test
  url: null
misskey:
  attachment:
    limit: 16
  status:
    default_max_length: 3000
  token: test
  url: https://misskey.delmulin.com/
mulukhiya:
  url: https://mstdn.b-shock.org/
package:
  authors:
    - Tatsuya Koishi
  description: ginseng Fediverse libraries
  email:
    - tkoishi@b-shock.co.jp
  license: MIT
  url: https://github.com/pooza/ginseng-fediverse
  version: 3.1.4
parser:
  note:
    url:
      patterns:
        - ^/notes/([[:alnum:]]+)
    visibility:
      direct:
        icon: envelope
        name: specified
      private:
        icon: lock
        name: followers
      public:
        icon: globe
        name: public
      unlisted:
        icon: house
        name: home
  toot:
    url:
      patterns:
        - ^/web/statuses/([[:digit:]]+)
        - ^/@[[:word:]]+/([[:digit:]]+)
        - ^/users/[[:word:]]+/statuses/([[:digit:]]+)
        - ^/ap/users/[[:digit:]]+/statuses/([[:digit:]]+)
        - ^/notice/([[:word:]]+)
    visibility:
      direct:
        icon: envelope
        name: direct
      private:
        icon: lock
        name: private
      public:
        icon: earth-asia
        name: public
      unlisted:
        icon: lock-open
        name: unlisted
pleroma:
  attachment:
    limit: 4
  status:
    default_max_length: 5000
  token: test
  url: null
